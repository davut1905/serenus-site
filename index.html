<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Serenus · Danışan Yönetim Sistemi</title>
<meta name="description" content="Serenus, danışma merkezleri için danışan yönetim sistemi. Çok yakında.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--ink:#0B2A3F;--mut:#4A6574;--line:#D8E5EB;--cy:#0A93A4}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.7 Manrope,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;padding:32px max(20px,env(safe-area-inset-right)) 32px max(20px,env(safe-area-inset-left))}
.logo{width:min(340px,78vw);height:auto}
h1{font:600 clamp(26px,4.2vw,40px)/1.2 Poppins,Manrope,sans-serif;letter-spacing:-.02em;text-wrap:balance}
p{color:var(--mut);max-width:34em;text-wrap:balance}
.rule{width:56px;height:3px;border-radius:3px;background:var(--cy)}
a{color:var(--cy);font-weight:700;text-decoration:none;border-bottom:1.5px solid var(--line)}
a:hover{border-bottom-color:var(--cy)}
small{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<img class="logo" src="logo-yatay.svg" alt="Serenus · Danışan Yönetim Sistemi">
<div class="rule"></div>
<h1>Çok yakında</h1>
<p>Danışma merkezleri için geliştirilen Serenus, yeni yüzüyle çok yakında yayında. Bilgi almak için bize yazabilirsiniz.</p>
<a href="mailto:info@serenus.com.tr">info@serenus.com.tr</a>
<small>© Serenus</small>
</body>
</html>
